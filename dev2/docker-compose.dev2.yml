# ============================================================================
# DEV 2 - Lancer UNIQUEMENT Document + OCR (+ Postgres) pour developper en solo
# Utilise le schema partage de DEV 1 (../dev1/database/init.sql).
# Lancement :  docker compose -f docker-compose.dev2.yml up --build
# ============================================================================
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: medextract
      POSTGRES_PASSWORD: medextract
      POSTGRES_DB: medextract
    volumes:
      - ../dev1/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medextract"]
      interval: 5s
      timeout: 5s
      retries: 10

  document-service:
    build: ./services/document-service
    environment:
      DATABASE_URL: postgresql://medextract:medextract@postgres:5432/medextract
      JWT_SECRET_KEY: dev-secret-change-me
      OCR_SERVICE_URL: http://ocr-service:8083
      AI_SERVICE_URL: http://ocr-service:8083   # pas d'IA en solo : on ignore
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8082:8082"]

  ocr-service:
    build: ./services/ocr-service
    environment:
      DATABASE_URL: postgresql://medextract:medextract@postgres:5432/medextract
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8083:8083"]

volumes:
  uploads:
