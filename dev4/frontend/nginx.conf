server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 25M;

    # SPA : toutes les routes non-fichiers renvoient index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy des appels API vers l'API Gateway (service "nginx" du compose)
    location /api/ {
        proxy_pass http://nginx:80;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
}
