# ============================================================================
# API Gateway - MedExtract AI  (DEV 1)
# Redirige chaque prefixe /api/... vers le bon microservice.
# Point d'entree unique : http://localhost:8080
# ============================================================================
events { worker_connections 1024; }

http {
    resolver 127.0.0.11 valid=10s;   # DNS interne docker
    client_max_body_size 25M;        # coherent avec la limite d'upload de 20 MB

    # Bloc de reglages proxy reutilise dans chaque location
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_connect_timeout 10s;

    server {
        listen 80;
        server_name _;

        location /api/auth/       { proxy_pass http://auth-service:8081; }       # DEV 1
        location /api/documents/  { proxy_pass http://document-service:8082; }   # DEV 2
        location /api/ocr/        { proxy_pass http://ocr-service:8083; }         # DEV 2
        location /api/ai/         { proxy_pass http://ai-service:8084; }          # DEV 3
        location /api/chat/       { proxy_pass http://chatbot-service:8085; }     # DEV 3
        location /api/reports/    { proxy_pass http://reporting-service:8086; }   # DEV 4

        location /health {
            return 200 'gateway ok';
            add_header Content-Type text/plain;
        }
    }
}
